name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      # Restoring ~40 plugins from scratch takes about ten minutes, so keep the
      # folder between runs. The key changes whenever a plugin version in
      # quartz.lock.json changes; there is no fallback key on purpose, because
      # `plugin restore` skips folders that already exist and would keep a
      # stale plugin.
      - name: Cache Quartz plugins
        id: quartz-plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ runner.os }}-node22-${{ hashFiles('quartz.lock.json', 'package-lock.json') }}
      - name: Restore Quartz plugins
        if: steps.quartz-plugins.outputs.cache-hit != 'true'
        run: npx quartz plugin restore
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
